<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр по статьям УК РФ</title>
<style>
:root{
  --paper:#f7f4ec; --paper2:#efeadd; --card:#fffdf7;
  --ink:#23262e; --mut:#837d6e; --line:#e2dbcb; --line2:#d4cbb6;
  --acc:#7d2a33; --acc-soft:#f3e6e0; --gold:#8a6d2a;
  --ok:#2e6b46; --ok-soft:#e7f1e7; --bad:#a83232; --bad-soft:#f9e8e6;
  --shadow:0 1px 2px rgba(60,50,30,.05), 0 6px 18px rgba(60,50,30,.06);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--ink); line-height:1.55;
  background:linear-gradient(180deg,#faf8f1 0%, var(--paper) 40%, #f3efe4 100%);
  min-height:100vh;
}
::selection{background:var(--acc-soft)}
button{font-family:inherit}
.wrap{max-width:960px; margin:0 auto; padding:0 18px 48px}

/* ── шапка ── */
.topnav{
  position:sticky; top:0; z-index:20; background:rgba(250,248,241,.92);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topnav .in{max-width:960px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--serif); font-size:17px; letter-spacing:.2px; white-space:nowrap}
.brand b{color:var(--acc); font-weight:700}
.brand .sep{color:var(--line2); margin:0 8px}
.tabs{display:flex; gap:2px; flex-wrap:wrap}
.tabs button{
  background:none; border:none; color:var(--mut); cursor:pointer;
  font-size:14.5px; font-weight:600; padding:9px 13px; border-radius:10px;
  border-bottom:2px solid transparent; transition:.15s;
}
.tabs button:hover{color:var(--ink); background:#fff8}
.tabs button.active{color:var(--acc); background:var(--acc-soft); border-bottom-color:var(--acc)}
.brand svg, .tabs button svg{fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}
.brand svg{width:21px; height:21px; color:var(--acc); margin-right:8px; vertical-align:-5px}
.tabs button svg{width:16px; height:16px; margin-right:6px; vertical-align:-2.5px}

/* ── герои-блок ── */
header.hero{text-align:center; padding:44px 10px 30px}
.rule{max-width:520px; margin:0 auto; border-top:1px solid var(--line2); position:relative}
.rule+.rule{margin-top:6px}
.kicker{
  font-size:11.5px; letter-spacing:3px; text-transform:uppercase; color:var(--gold);
  font-weight:700; margin:16px 0 14px;
}
.hero h1{font-family:var(--serif); font-weight:700; font-size:clamp(30px,5.6vw,46px);
  letter-spacing:.2px; line-height:1.15; margin-bottom:16px}
.hero h1 .u{color:var(--acc)}

/* ── секции ── */
section{display:none}
section.active{display:block; animation:fade .3s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.chips{display:flex; flex-wrap:wrap; gap:7px; margin:14px 0}
.chip{
  background:transparent; border:1px solid var(--line2); color:var(--mut);
  border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; transition:.15s;
}
.chip:hover{color:var(--ink); border-color:var(--ink)}
.chip.active{background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600}
.chip small{opacity:.6; font-weight:400}
.search{
  width:100%; background:var(--card); border:1px solid var(--line2); color:var(--ink);
  border-radius:12px; padding:13px 18px; font-size:15px; outline:none; margin-top:6px;
  box-shadow:var(--shadow); transition:.15s;
}
.search::placeholder{color:#a9a294}
.search:focus{border-color:var(--acc)}
.hint{color:var(--mut); font-size:12.5px; margin:10px 2px 14px}

/* ── карточки статей ── */
.acards{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:640px){.acards{grid-template-columns:1fr}}
.acard{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 18px 14px; position:relative; transition:.18s; box-shadow:var(--shadow);
}
.acard:hover{border-color:var(--line2); transform:translateY(-2px); box-shadow:0 3px 6px rgba(60,50,30,.07),0 10px 24px rgba(60,50,30,.09)}
.acard .top{display:flex; align-items:baseline; gap:10px; margin-bottom:7px}
.num{font-family:var(--serif); color:var(--acc); font-weight:700; font-size:17px; white-space:nowrap}
.acard h3{font-family:var(--serif); font-size:16.5px; line-height:1.3; font-weight:700; padding-right:26px}
.acard .pun{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line)}
.pun-label{display:block; font-size:10px; letter-spacing:1.8px; text-transform:uppercase;
  color:var(--gold); font-weight:700; margin-bottom:3px}
.acard .pun, .face .pun{font-size:13.5px; color:#5d5648}
.acard .cat{display:inline-block; font-size:11px; color:var(--mut); margin-top:10px;
  border:1px solid var(--line); border-radius:999px; padding:2.5px 11px}
.star{
  position:absolute; top:13px; right:13px; background:none; border:none; cursor:pointer;
  font-size:18px; color:#cdc5b2; transition:.15s; line-height:1; padding:2px;
}
.star:hover{transform:scale(1.25); color:var(--gold)}
.star.on{color:var(--gold)}
.empty{color:var(--mut); text-align:center; padding:40px 0; font-family:var(--serif); font-style:italic}

/* ── флеш-карточки ── */
.fcwrap{max-width:470px; margin:22px auto 0; text-align:center}
.fc{perspective:1400px; height:300px}
.fc-inner{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.4,.1,.2,1); transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1px solid var(--line2); outline:1px solid var(--line); outline-offset:5px;
  border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:26px; gap:13px; box-shadow:var(--shadow);
}
.face.back{transform:rotateY(180deg)}
.face .bignum{font-family:var(--serif); font-size:64px; font-weight:700; color:var(--acc); line-height:1}
.face .small{color:var(--mut); font-size:11px; letter-spacing:2.4px; text-transform:uppercase}
.face h3{font-family:var(--serif); font-size:20px; line-height:1.3}
.face .pun{margin-top:2px}
.face .cat{font-size:11px; color:var(--mut); border:1px solid var(--line); border-radius:999px; padding:2.5px 11px}
.fbtns{display:flex; gap:10px; justify-content:center; margin-top:18px}
.btn{
  border:none; border-radius:11px; padding:12px 24px; font-size:14.5px; font-weight:600;
  cursor:pointer; transition:.15s; color:var(--paper); background:var(--ink);
  letter-spacing:.2px;
}
.btn:hover{filter:brightness(1.25)}
.btn.ghost{background:var(--card); border:1px solid var(--line2); color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4; cursor:default}
.prog{color:var(--mut); font-size:13px; margin-top:16px}
.bar{height:7px; background:var(--paper2); border-radius:6px; overflow:hidden; margin-top:7px}
.bar i{display:block; height:100%; background:var(--acc); border-radius:6px; transition:width .3s}

/* ── тест ── */
.qbox{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:24px 26px; max-width:620px; margin:22px auto 0; box-shadow:var(--shadow);
}
.qbox .qt{font-size:12px; letter-spacing:1.8px; text-transform:uppercase; color:var(--gold);
  font-weight:700; margin:14px 0 8px}
.qbox h2{font-family:var(--serif); font-size:20px; margin-bottom:16px; line-height:1.35}
.qmeta{display:flex; justify-content:space-between; color:var(--mut); font-size:13px; margin-bottom:10px}
.opt{
  display:block; width:100%; text-align:left; background:transparent; color:var(--ink);
  border:1px solid var(--line2); border-radius:11px; padding:12.5px 16px; font-size:14.5px;
  margin-bottom:9px; cursor:pointer; transition:.15s;
}
.opt:hover:not(:disabled){border-color:var(--ink); background:#fff}
.opt.correct{background:var(--ok-soft); border-color:var(--ok); color:#1d4d33; font-weight:600}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:#7a2222}
.opt:disabled{cursor:default}
.result{text-align:center; padding:34px 10px}
.result .big{font-family:var(--serif); font-size:56px; font-weight:700; color:var(--acc)}
.result .bigicon{width:54px; height:54px; color:var(--ok); fill:none; stroke:currentColor;
  stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.result p{color:var(--mut); margin:10px 0 18px; font-family:var(--serif); font-style:italic; font-size:16px}
.mist{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 22px; margin-top:14px; box-shadow:var(--shadow)}
.mist ul{list-style:none}
.mist li{margin:12px 0; font-size:14px; padding-bottom:12px; border-bottom:1px dashed var(--line)}
.mist li:last-child{border-bottom:none; margin-bottom:0}
.mist b{color:var(--acc); font-family:var(--serif)}
.center{text-align:center}

/* ── статистика ── */
.sgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:18px 0}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px;
  text-align:center; box-shadow:var(--shadow)}
.stat .v{font-family:var(--serif); font-size:32px; font-weight:700; color:var(--acc)}
.stat .l{color:var(--mut); font-size:12.5px; margin-top:5px}
.prow{display:flex; align-items:center; gap:12px; margin:9px 0; font-size:13px}
.prow .name{width:200px; color:#5d5648; flex-shrink:0; font-weight:600}
.prow .bar{flex:1; margin:0}
.prow .pc{width:48px; text-align:right; color:var(--mut); font-variant-numeric:tabular-nums}
</style>
</head>

</nav>

<div class="wrap">

<script>

}));

function chipsHTML(active) {
  const counts = {};

}

  $("chipsLearn").innerHTML = chipsHTML(curCat);

    (curCat === "Все" || a[2] === curCat) &&
    (!q || a[0].toLowerCase().includes(q) || a[1].toLowerCase().includes(q))
  );

}

}

  const others = shuffle(ARTICLES.filter(x => x[0] !== a[0]));
  const pick = n => { const out = []; const used = new Set();
    for (const o of others) { const v = o[type === 2 ? 3 : (type === 0 ? 1 : 0)];
      if (!used.has(v)) { out.push(o); used.add(v); } if (out.length === n) break; }
    return out; };
  if (type === 0) { qText = `Что такое ст. ${a[0]} УК РФ?`; right = a[1];
    opts = shuffle([right, ...pick(3).map(o => o[1])]); }
  else if (type === 1) { qText = `Статья УК РФ «${a[1]}» — это статья…`; right = a[0];
    opts = shuffle([right, ...pick(3).map(o => o[0])]); }
  else { qText = `Какое наказание (кратко) предусмотрено ст. ${a[0]} УК РФ «${a[1]}»?`; right = a[3];
    opts = shuffle([right, ...pick(3).map(o => o[3])]); }
  return { qText, right, opts, answered: false };
}
function renderQ() {
  if (quiz.i >= quiz.qs.length) return renderResult();
  const q = quiz.qs[quiz.i];
  $("quizArea").innerHTML = `
    <div class="qbox">
      <div class="qmeta"><span>Вопрос ${quiz.i+1} / ${quiz.qs.length}</span><span>Верно: ${quiz.right}</span></div>
      <div class="bar"><i style="width:${(quiz.i/quiz.qs.length*100).toFixed(0)}%"></i></div>
      <h2 style="margin-top:14px">${esc(q.qText)}</h2>
      ${q.opts.map((o,i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}
      <div class="center" id="quitWrap" style="margin-top:6px"><button class="btn ghost" onclick="endQuiz()">Завершить</button></div>
    </div>`;
  $("quizArea").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(b)));
}
function answer(btn) {
  const q = quiz.qs[quiz.i];
  const chosen = q.opts[+btn.dataset.i];
  const isRight = chosen === q.right;
  $("quizArea").querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (q.opts[+b.dataset.i] === q.right) b.classList.add("correct");
  });
  if (!isRight) { btn.classList.add("wrong"); quiz.mistakes.push(q); }
  else quiz.right++;
  quiz.answered = true;
  const box = $("quizArea").querySelector(".qbox");
  const nx = document.createElement("button");
  nx.className = "btn"; nx.style.cssText = "display:block; margin:10px auto 0";
  nx.textContent = quiz.i === quiz.qs.length - 1 ? "Результат →" : "Следующий вопрос →";
  nx.onclick = () => { quiz.i++; renderQ(); };
  box.insertBefore(nx, document.getElementById("quitWrap"));
}
function renderResult() {
  stats.attempts++;
  if (quiz.right > stats.best) stats.best = quiz.right;
  save();
  const pct = Math.round(quiz.right / quiz.qs.length * 100);
  const msg = pct === 100 ? "Идеально!" : pct >= 70 ? "Хороший результат!" : pct >= 40 ? "Неплохо, но есть над чем поработать" : "Повторите статьи — и снова!";
  $("quizArea").innerHTML = `<div class="result">
    <div class="big">${quiz.right} / ${quiz.qs.length}</div>
    <p>${msg} Лучший результат: ${stats.best} из 10.</p>
    ${quiz.mistakes.length ? `<div class="mist"><b>Разбор ошибок:</b><ul>${quiz.mistakes.map(q =>
      `<li>${esc(q.qText)}<br>Верный ответ: <b>${esc(q.right)}</b></li>`).join("")}</ul></div>` : ""}
    <br><button class="btn" onclick="startQuiz()">Пройти заново</button>
    <button class="btn ghost" onclick="quizHome()">На главный экран</button>
  </div>`;
}
function endQuiz() { quiz = null; quizHome(); }
function quizHome() {
  $("quizArea").innerHTML = `<div class="result">
    <p>Лучший результат: <b>${stats.best}</b> из 10 · попыток: ${stats.attempts}</p>
    <button class="btn" onclick="startQuiz()">Начать тест</button></div>`;
}
quizHome();

// ---------- статистика ----------
function renderStats() {
  const counts = {}, kn = {};
  ARTICLES.forEach(a => { counts[a[2]] = (counts[a[2]] || 0) + 1; if (known.has(a[0])) kn[a[2]] = (kn[a[2]] || 0) + 1; });
  const pct = Math.round(known.size / ARTICLES.length * 100);
  $("statsArea").innerHTML = `
    <div class="sgrid">
      <div class="stat"><div class="v">${ARTICLES.length}</div><div class="l">статей в тренажёре</div></div>
      <div class="stat"><div class="v">${known.size}</div><div class="l">отмечено выученными ★</div></div>
      <div class="stat"><div class="v">${stats.attempts}</div><div class="l">тестов пройдено</div></div>
      <div class="stat"><div class="v">${stats.best}/10</div><div class="l">лучший результат теста</div></div>
    </div>
    <p class="hint" style="text-align:center">Общий прогресс: ${pct}%</p>
    <div class="bar" style="max-width:420px; margin:0 auto 20px"><i style="width:${pct}%"></i></div>
    ${CATS.map(c => { const p = Math.round((kn[c]||0) / counts[c] * 100);
      return `<div class="prow"><span class="name">${c}</span>
        <div class="bar"><i style="width:${p}%"></i></div><span class="pc">${kn[c]||0}/${counts[c]}</span></div>`; }).join("")}
    <p class="center" style="margin-top:22px"><button class="btn ghost" id="resetBtn">Сбросить прогресс</button></p>`;
  $("resetBtn").onclick = () => {
    if (confirm("Точно сбросить весь прогресс (★ и результаты тестов)?")) {
      known = new Set(); stats = { attempts: 0, best: 0 }; save(); renderStats();
    }
  };
}

// ---------- старт ----------
renderLearn();
renderCards();
</script>
